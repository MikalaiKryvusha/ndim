     ВОПРОС ВЛАДЕЛЬЦА (дословно, 2026-08-22):
       «а где хабы в приложении? …может для них напрашивается отдельный пункт
        в рельсе навигации?»

     ═══ ФАКТ, С КОТОРОГО ВСЁ НАЧАЛОСЬ — проверен грепом, а не памятью ═══
     Из личных экранов на `/{lang}/catalog` НЕ ВЕДЁТ НИ ОДНА ССЫЛКА. Проверка:
       grep -rn "catalog" src/routes/profile src/routes/dims src/routes/menu \
                          src/routes/space src/routes/relations src/lib/ui
     Единственное совпадение — слово «catalogue» в английском тексте виджета
     «Пространства», и это не ссылка. Публичные страницы строились для пришедших
     из поиска; двери ЖИТЕЛЯ в задумке не было вовсе.

     ═══ ЧТО РЕШАЕТ ЭТА СТРАНИЦА — ОДИН вопрос ═══
     ГДЕ у жителя дверь в публичные Рейтинги. Четыре места, четыре цены.

     ═══ ЧЕСТНОСТЬ МАКЕТА ═══
       · Токены обеих тем скопированы из `src/routes/+layout.svelte` ДОСЛОВНО.
       · Пункты рельса и нижней панели — из `SideRail.svelte` и `BottomNav.svelte`:
         тот же порядок, те же подписи, те же пороги.
       · Иконки — НАСТОЯЩИЕ контуры из `src/lib/ui/icons.ts`, подставлены прибором,
         а не перерисованы. Иконка `stars` в наборе УЖЕ ЕСТЬ — новую рисовать
         не пришлось ни в одном варианте.
       · Числа видов — из `src/lib/content/dim-kind.ts`: фильмы 2774 · видеоигры
         1221 · сериалы 370 · романы 231 · практики 228.
       · Рельс живёт от 1024px, ниже работает нижняя панель (порог объявлен в обоих
         компонентах). Поэтому на 390 у каждого варианта показано СВОЁ мобильное
         решение, а не десктопное в узком окне.

     ═══ СЛОВАРЬ ═══
     Наружу — «Рейтинги» и «NDim Space Rating». Слова «хаб» на лице нет нигде:
     это наш внутренний жаргон (`AGENT_GUIDE.md` → Словарь продукта).

  }
  :root[data-theme='dark'] {
    --bg: #060b14; --panel: rgba(10, 21, 38, 0.78); --panel-solid: #091322;
    --edge: rgba(77, 159, 255, 0.22); --edge-soft: rgba(77, 159, 255, 0.14);
    --primary: #1467d6; --primary-ink: #ffffff; --accent: #3fd9ff; --star: #ffc93d;
    --heading: #eef6ff; --text: #dce9f7; --dim: #8299b1; --faint: #6d84a0;
    --card-shadow: 0 0 0 1px rgba(63, 217, 255, 0.06), 0 24px 60px rgba(2, 8, 20, 0.6);
  }

  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f1826; }

  .picker {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: #14293d; color: #fff; font-size: 13px;
  }
  .picker b { margin-right: 6px; }
  .picker button {
    font: inherit; cursor: pointer; padding: 6px 13px; border-radius: 999px;
    border: 1px solid #2d4a66; background: transparent; color: #cfe0ef;
  }
  .picker button.active { background: #1467d6; border-color: transparent; color: #fff; font-weight: 600; }
  .picker .sp { flex: 1; }

  .note {
    padding: 14px 16px; background: #0d1b2a; color: #b7cde0; font-size: 14px; line-height: 1.65;
    border-bottom: 1px solid #1d3247;
  }
  .note b { color: #fff; }
  .note .price { color: #9fe6b4; }
  .note .risk { color: #ffb9a8; }

  .stage { padding: 26px 16px 70px; background: #0f1826; }
  .cap { color: #8fa9c0; font-size: 13px; text-align: center; margin-bottom: 12px; line-height: 1.5; }
  .cap b { color: #fff; }

  /* ── Полотно приложения ─────────────────────────────────────────────────── */
  .app {
    margin: 0 auto; background: var(--bg); color: var(--text);
    border-radius: 20px; overflow: hidden; box-shadow: var(--card-shadow); display: grid;
  }
  .stage[data-w='390'] .app { width: 390px; grid-template-rows: auto 1fr auto; min-height: 730px; }
  .stage[data-w='1440'] .app { width: 1180px; grid-template-columns: 216px 1fr; grid-template-rows: auto 1fr; min-height: 680px; }

  /* Шапка тянется во всю ширину поверх рельса (V3-А, ideas/17). */
  .bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; height: 55px; background: var(--panel-solid); border-bottom: 1px solid var(--edge);
  }
  .stage[data-w='390'] .bar { height: 61px; }
  .bar .mark {
    width: 26px; height: 26px; border-radius: 8px; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
  }
  .bar .ttl { color: var(--heading); font-weight: 650; font-size: 15px; }

  /* ── Рельс (из SideRail.svelte) ─────────────────────────────────────────── */
  .rail { display: none; }
  .stage[data-w='1440'] .rail {
    display: flex; flex-direction: column; gap: 3px;
    padding: 16px 12px; background: var(--panel); border-right: 1px solid var(--edge);
  }
  .rail a {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px;
    border-radius: 10px; font-size: 14px; text-decoration: none; color: var(--dim);
  }
  .rail a.on { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 650; }
  .rail a.newdoor { color: var(--primary); }
  .rail .ico { width: 22px; display: flex; justify-content: center; line-height: 1; }
  .rail .ico svg { width: 22px; height: 22px; fill: currentColor; }

  /* ── Нижняя панель (из BottomNav.svelte) ────────────────────────────────── */
  .bnav { display: none; }
  .stage[data-w='390'] .bnav {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--panel-solid); border-top: 1px solid var(--edge); padding: 6px 2px 10px;
  }
  .bnav a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    text-decoration: none; color: var(--dim); font-size: 11px; text-align: center;
    padding: 4px 1px; border-radius: 10px; min-width: 0;
  }
  .bnav a.on { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 650; }
  .bnav a.newdoor { color: var(--primary); }
  .bnav .ico svg { width: 26px; height: 26px; fill: currentColor; }
  /* Шесть пунктов вместо пяти: подпись обязана ужаться — это и есть цена V1 на телефоне. */
  .bnav.six a { font-size: 9.5px; letter-spacing: -0.015em; }
  .bnav.six .ico svg { width: 23px; height: 23px; }

  /* ── Контент ────────────────────────────────────────────────────────────── */
  .content { padding: 20px 16px 26px; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .h1 { color: var(--heading); font-size: 20px; font-weight: 700; }
  .sub { color: var(--dim); font-size: 13px; line-height: 1.5; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 14px; }
  .card h3 { color: var(--heading); font-size: 14px; font-weight: 650; margin-bottom: 9px; }

  /* Дверь-карточка (V2) и виджет-дверь (V3) */
  .door {
    display: flex; align-items: center; gap: 12px; text-decoration: none;
    border: 1px solid color-mix(in srgb, var(--primary) 34%, var(--edge));
    background: color-mix(in srgb, var(--primary) 6%, var(--panel));
    border-radius: 14px; padding: 13px 14px;
  }
  .door .ico { color: var(--primary); display: flex; }
  .door .ico svg { width: 24px; height: 24px; fill: currentColor; }
  .door .tx { flex: 1; min-width: 0; }
  .door .tx b { display: block; color: var(--heading); font-size: 14.5px; font-weight: 650; }
  .door .tx span { color: var(--dim); font-size: 12.5px; }
  .door .chev { color: var(--faint); display: flex; }
  .door .chev svg { width: 13px; height: 13px; fill: currentColor; }

  /* Плитки видов — публичная витрина */
  .kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 9px; }
  .kind { border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
  .kind b { display: block; color: var(--heading); font-size: 13.5px; font-weight: 650; }
  .kind span { color: var(--dim); font-size: 12px; }

  /* Строки экрана «Измерения» — МОЁ оценивание */
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 13px;
         background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
  .row .nm { flex: 1; color: var(--heading); font-size: 14px; font-weight: 600; }
  .row .st { color: var(--star); font-size: 13px; letter-spacing: 1px; }

  /* Сетка виджетов «Пространства» */
  .wgrid { display: grid; gap: 12px; }
  .stage[data-w='1440'] .wgrid { grid-template-columns: 1fr 1fr; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; }
  .kv .k { color: var(--dim); } .kv .v { color: var(--heading); font-weight: 650; }
  .ndsr { color: var(--primary); font-weight: 700; }
  .door.wdoor { margin-top: 10px; }

  /* Строки экрана «Меню» */
  .mrow { display: flex; align-items: center; gap: 11px; padding: 12px 13px;
          background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; text-decoration: none; }
  .mrow .ic { color: var(--dim); display: flex; }
  .mrow .ic svg { width: 20px; height: 20px; fill: currentColor; }
  .mrow .lb { flex: 1; color: var(--text); font-size: 14px; }
  .mrow .chev { color: var(--faint); display: flex; }
  .mrow .chev svg { width: 13px; height: 13px; fill: currentColor; }
  .mrow.newdoor { border-color: color-mix(in srgb, var(--primary) 34%, var(--edge)); }
  .mrow.newdoor .ic, .mrow.newdoor .lb { color: var(--primary); font-weight: 600; }
  .mhead { color: var(--faint); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; margin: 8px 0 -3px 4px; }
</style>

const svg = (name) => {
  const i = ICONS[name];
  return i ? `<svg viewBox="${i.box}" aria-hidden="true">${i.d}</svg>` : '';
};

/* Пункты навигации — порядок и подписи из SideRail.svelte / BottomNav.svelte. */
const NAV = [
  { key: 'profile', icon: 'home', label: 'Профиль' },
  { key: 'relations', icon: 'relations', label: 'Связи' },
  { key: 'space', icon: 'space', label: 'Пространство' },
  { key: 'dims', icon: 'dimensions', label: 'Измерения' },
  { key: 'menu', icon: 'menu', label: 'Меню' },
];
const DOOR = { key: 'ratings', icon: 'stars', label: 'Рейтинги', door: true };

const rail = (items, active) => `<nav class="rail">${items.map((i) =>
  `<a class="${i.key === active ? 'on' : ''} ${i.door ? 'newdoor' : ''}"><span class="ico">${svg(i.icon)}</span>${i.label}</a>`).join('')}</nav>`;

const bnav = (items, active) => `<nav class="bnav ${items.length > 5 ? 'six' : ''}">${items.map((i) =>
  `<a class="${i.key === active ? 'on' : ''} ${i.door ? 'newdoor' : ''}"><span class="ico">${svg(i.icon)}</span>${i.label}</a>`).join('')}</nav>`;

const bar = (title) => `<header class="bar"><span class="mark">N</span><span class="ttl">${title}</span></header>`;

/* Виды каталога — числа из src/lib/content/dim-kind.ts. */
const KINDS = [
  ['Фильмы', 2774], ['Видеоигры', 1221], ['Сериалы', 370], ['Романы', 231], ['Практики', 228],
];
const kindTiles = () => `<div class="kinds">${KINDS.map(([n, c]) =>
  `<div class="kind"><b>${n}</b><span>${c.toLocaleString('ru')} в рейтинге</span></div>`).join('')}</div>`;

/* Публичная витрина Рейтингов — то, КУДА ведёт дверь. Одинаково во всех вариантах. */
const ratingsScreen = () => `<div class="content">
  <div class="h1">Рейтинги</div>
  <div class="sub">NDim Space Rating отображает симпатии жителей Пространства NDim Space.</div>
  ${kindTiles()}
</div>`;

/* Экран «Измерения» — МОЁ оценивание. Роли не путать: здесь я ставлю оценки. */
const dimsScreen = (withDoor) => `<div class="content">
  <div class="h1">Измерения</div>
  ${withDoor ? `<a class="door"><span class="ico">${svg('stars')}</span>
    <span class="tx"><b>Рейтинги Пространства</b><span>Как это оценили все — NDim Space Rating</span></span>
    <span class="chev">${svg('chevron')}</span></a>` : ''}
  <div class="sub">Мои оценки</div>
  <div class="row"><span class="nm">«Одиссея»</span><span class="st">★★★★★★★★☆☆</span></div>
  <div class="row"><span class="nm">«Кобра»</span><span class="st">★★★★★★★☆☆☆</span></div>
  <div class="row"><span class="nm">Плавание</span><span class="st">★★★★★★★★★☆</span></div>
</div>`;

/* Экран «Пространство» — виджетная сетка (канон дашборда, решение владельца 2026-07-12). */
const spaceScreen = (withWidget) => `<div class="content">
  <div class="h1">Пространство</div>
  <div class="wgrid">
    ${withWidget ? `<div class="card">
      <h3>Сегодня в Рейтингах</h3>
      <div class="kv"><span class="k">«Одиссея»</span><span class="v ndsr">8,4</span></div>
      <div class="kv"><span class="k">«Кобра»</span><span class="v ndsr">7,1</span></div>
      <div class="kv"><span class="k">Плавание</span><span class="v ndsr">9,0</span></div>
      <a class="door wdoor"><span class="ico">${svg('stars')}</span>
        <span class="tx"><b>Все Рейтинги</b><span>5 видов · 5 125 измерений</span></span>
        <span class="chev">${svg('chevron')}</span></a>
    </div>` : ''}
    <div class="card"><h3>Сегодня</h3>
      <div class="kv"><span class="k">Новых жителей</span><span class="v">3</span></div>
      <div class="kv"><span class="k">Новых оценок</span><span class="v">128</span></div>
    </div>
    <div class="card"><h3>Сейчас в Пространстве</h3>
      <div class="kv"><span class="k">Всего людей</span><span class="v">342</span></div>
      <div class="kv"><span class="k">Новых за 30 дней</span><span class="v">17</span></div>
    </div>
    <div class="card"><h3>Сервер синхронизации</h3>
      <div class="kv"><span class="k">Состояние</span><span class="v">Работает</span></div>
    </div>
  </div>
</div>`;

/* Экран «Меню». */
const menuScreen = (withDoor) => `<div class="content">
  <div class="h1">Меню</div>
  ${withDoor ? `<div class="mhead">Пространство</div>
  <a class="mrow newdoor"><span class="ic">${svg('stars')}</span><span class="lb">Рейтинги</span><span class="chev">${svg('chevron')}</span></a>` : ''}
  <div class="mhead">Документы</div>
  <a class="mrow"><span class="ic">${svg('manual')}</span><span class="lb">Руководство</span><span class="chev">${svg('chevron')}</span></a>
  <a class="mrow"><span class="ic">${svg('terms')}</span><span class="lb">Условия</span><span class="chev">${svg('chevron')}</span></a>
  <a class="mrow"><span class="ic">${svg('privacy')}</span><span class="lb">Приватность</span><span class="chev">${svg('chevron')}</span></a>
</div>`;

/* ── Четыре варианта ────────────────────────────────────────────────────── */
const VARIANTS = {
  1: {
    cap: '<b>V1 — шестой пункт рельса «Рейтинги».</b> Дверь стоит вровень с разделами продукта.<br>На телефоне рельса нет, поэтому пункт обязан встать в нижнюю панель — и она становится шестиместной.',
    note: '<b>V1 — шестой пункт рельса.</b> Вариант, который назвал сам владелец. Дверь видна всегда и с любого экрана, иконка <b>stars</b> в наборе уже есть — рисовать нечего. '
        + '<span class="price">Цена: правка двух компонентов (SideRail, BottomNav) + активное состояние на публичных страницах.</span> '
        + '<b>Тесноты на телефоне НЕТ — это проверено кадром, а не предположено:</b> подпись ужимается с 11px до 9,5px, и «Пространство», самое длинное слово панели, помещается целиком. '
        + '<span class="risk">Настоящий риск другой и он не про вёрстку: шестой пункт впервые ставит ПУБЛИЧНУЮ поверхность вровень с личными разделами. Пять нынешних пунктов — это «моё» (мой профиль, мои связи, моё пространство, мои измерения); «Рейтинги» — «общее». Если это верно по замыслу — вариант лучший из четырёх.</span>',
    desktop: () => rail([...NAV.slice(0, 4), DOOR, NAV[4]], 'ratings') + ratingsScreen(),
    mobile: () => ratingsScreen() + bnav([...NAV.slice(0, 4), DOOR, NAV[4]], 'ratings'),
    title: 'Рейтинги',
  },
  2: {
    cap: '<b>V2 — дверь с экрана «Измерения».</b> Рядом с тем, что человек оценивает сам.<br>Роли РАЗВЕДЕНЫ: «Измерения» — мои оценки, «Рейтинги Пространства» — как это оценили все.',
    note: '<b>V2 — дверь с «Измерений».</b> Дверь стоит там, где мысль о рейтинге уже возникла: человек ставит оценку и тут же видит, что думают остальные. Одинаково работает на телефоне и десктопе — правится один экран. '
        + '<span class="price">Цена: одна карточка в /dims, ни рельс, ни панель не трогаются.</span> '
        + '<span class="risk">Риск: дверь видна только на «Измерениях» — с «Профиля» и «Связей» до Рейтингов по-прежнему не дойти. И главный риск — СМЕШЕНИЕ РОЛЕЙ: если подпись не разведёт «мои оценки» и «оценки всех», человек решит, что это одно и то же.</span>',
    desktop: () => rail(NAV, 'dims') + dimsScreen(true),
    mobile: () => dimsScreen(true) + bnav(NAV, 'dims'),
    title: 'Измерения',
  },
  3: {
    cap: '<b>V3 — виджет «Сегодня в Рейтингах» на «Пространстве».</b> Дверь показывает СОДЕРЖИМОЕ, а не только ведёт.<br>Виджетная сетка — канон дашборда (решение владельца 2026-07-12).',
    note: '<b>V3 — виджет на «Пространстве».</b> Единственный вариант, где дверь что-то РАССКАЗЫВАЕТ до нажатия: три живых NDSR видны сразу. Ложится в виджетную сетку, то есть в будущем переставляется и убирается наравне с остальными. '
        + '<span class="price">Цена: новый виджет + запрос трёх значений NDSR (данные уже в каталоге, новых чтений базы не нужно).</span> '
        + '<span class="risk">Риск: «Пространство» — экран, куда заходят не каждый день, и виджет конкурирует за первый экран с четырьмя существующими. На телефоне сетка одноколоночная — порядок виджетов решает, увидят его или нет.</span>',
    desktop: () => rail(NAV, 'space') + spaceScreen(true),
    mobile: () => spaceScreen(true) + bnav(NAV, 'space'),
    title: 'Пространство',
  },
  4: {
    cap: '<b>V4 — пункт в «Меню».</b> Самый дешёвый вариант, взят для сравнения цены.<br>Новая группа «Пространство» над документами — чтобы Рейтинги не читались как ещё один правовой документ.',
    note: '<b>V4 — пункт в «Меню».</b> Одна строка, ноль правок навигации, работает на обеих ширинах сразу. Взят как нижняя граница цены — с ним сравниваются остальные три. '
        + '<span class="price">Цена: одна строка в /menu. Дешевле не бывает.</span> '
        + '<span class="risk">Риск: «Меню» — ящик для документов и настроек, и Рейтинги в нём выглядят служебными. Житель, не открывавший «Меню», о публичных Рейтингах не узнает вовсе — то есть вопрос «а где хабы?» останется в силе, просто ответ на него будет существовать.</span>',
    desktop: () => rail(NAV, 'menu') + menuScreen(true),
    mobile: () => menuScreen(true) + bnav(NAV, 'menu'),
    title: 'Меню',
  },
};

let current = 1;
const stage = document.getElementById('stage');
const render = () => {
  const v = VARIANTS[current];
  document.getElementById('cap').innerHTML = v.cap;
  document.getElementById('note').innerHTML = v.note;
  const wide = stage.dataset.w === '1440';
  document.getElementById('app').innerHTML =
    `<div class="app">${bar(v.title)}${wide ? v.desktop() : v.mobile()}</div>`;
};

document.querySelectorAll('.picker button[data-v]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.picker button[data-v]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    current = Number(b.dataset.v);
    render();
  };
});

const themeBtn = document.getElementById('theme');
themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? '☾ тёмная' : '☀ светлая';
};

/* Ширины ровно 390 и 1440 — их ждёт съёмщик tools/shoot-mockups.mjs. */
const widthBtn = document.getElementById('width');
widthBtn.onclick = () => {
  const wide = stage.dataset.w === '1440';
  stage.dataset.w = wide ? '390' : '1440';
  widthBtn.textContent = wide ? 'Телефон 390' : 'Десктоп 1440';
  render();
};

render();
</script>
</body>
</html>
