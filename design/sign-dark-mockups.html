<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Знак NDim в тёмной теме — подложка, 4 варианта</title>
<!--
  ЗАЧЕМ ЭТОТ НАБОР. Вопрос владельцу о подложке знака в тёмной теме был подан ТЕКСТОМ, и его
  слово 2026-08-29: «могли бы к вопросу и скриншот приложить. Я по тексту видеть не умею,
  представляете?! (сарказм)». Упрёк справедлив — вопрос переподаётся кадрами.

  🔴 ФАКТ ИСПРАВЛЕН ПО КОДУ, а не перенесён из прежней записки. В STATUS.md стояло
  «--plate: #060b14 против --bg: #070c16, три единицы по синему каналу». Это НЕВЕРНО:
  · бой, тёмная тема: --bg: #060b14 (src/routes/+layout.svelte:107);
  · подложка знака: fill="#060b14" ЗАХАРДКОЖЕН (src/lib/ui/Brand.svelte:31), не токен.
  Цвета СОВПАДАЮТ побайтно. Подложка не «теряется» и не «еле видна» — её нет вовсе, знак
  лежит прямо на фоне страницы. А #070c16 — это фон МАКЕТОВ (design/*.html), то есть число
  из другого контура (класс EXP-0226).

  Практическое следствие, которое и делает вопрос брендовым: в СВЕТЛОЙ теме (--bg: #f6f8fb)
  тёмная плашка видна и задаёт знаку силуэт — скруглённую плитку. В тёмной теме силуэта нет.
  Один и тот же знак имеет две разные формы в зависимости от темы, и решает это не дизайн,
  а совпадение двух чисел.

  ФОРМА ЗНАКА КАНОНИЧНА (лого V3 «Диагональ», утверждено владельцем 2026-07-11): «освежать
  можно только цветом». Ни один вариант ниже линий и узлов НЕ трогает — меняется только
  подложка под ними. Геометрия скопирована из Brand.svelte байт-в-байт.

  Дом стиля: кадры снимаются по [data-crop] (node tools/shoot-crops.mjs).
-->
<style>
  :root {
    /* Числа боя, а не макетов: сверено с src/routes/+layout.svelte блок [data-theme='dark']. */
    --bg: #060b14;
    --panel-solid: #091322;
    --edge: rgba(77, 159, 255, 0.22);
    --edge-soft: rgba(77, 159, 255, 0.14);
    --accent: #3fd9ff;
    --heading: #eef6ff;
    --dim: #8299b1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--heading);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 28px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--dim); margin: 0 0 26px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }

  /* Кроп — ровно то, что уедет в страницу владельцу: знак крупно на НАСТОЯЩЕМ фоне боя,
     с полем вокруг, чтобы силуэт подложки (или его отсутствие) было видно. */
  .crop {
    width: 260px; height: 260px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .cap { color: var(--dim); font-size: 13px; margin-top: 8px; width: 260px; }
  .cap b { color: var(--heading); font-weight: 600; }
  figure { margin: 0; }
</style>
</head>
<body>

<h1>Знак NDim в тёмной теме — подложка</h1>
<p class="sub">
  Фон на всех кадрах — настоящий фон боя <code>#060b14</code>. Форма знака не меняется ни в одном
  варианте: она канонична. Меняется только подложка под ним, и каждый вариант делает это
  РАЗНЫМ способом — границей, заливкой, прозрачностью или светом.
</p>

<div class="row">

  <figure>
    <div class="crop" data-crop="sign-current">
      <svg width="150" height="150" viewBox="0 0 96 96" aria-hidden="true">
        <defs><linearGradient id="g0" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="68" y2="70">
          <stop offset="0" stop-color="#4d9fff" /><stop offset="1" stop-color="#3fd9ff" /></linearGradient></defs>
        <rect width="96" height="96" rx="22" fill="#060b14" />
        <g stroke="url(#g0)" stroke-width="6.7" fill="none">
          <line x1="36.5" y1="29" x2="30" y2="66" /><line x1="36.5" y1="29" x2="59.5" y2="66" /><line x1="59.5" y1="66" x2="66" y2="29" /></g>
        <g fill="url(#g0)">
          <circle cx="36.5" cy="29" r="9.3" /><circle cx="30" cy="66" r="9.3" /><circle cx="59.5" cy="66" r="9.3" /><circle cx="66" cy="29" r="9.3" /></g>
      </svg>
    </div>
    <div class="cap"><b>КАК ЕСТЬ.</b> Подложка залита <code>#060b14</code> — тем же цветом, что фон. Плитки нет.</div>
  </figure>

  <figure>
    <div class="crop" data-crop="sign-v1-kant">
      <svg width="150" height="150" viewBox="0 0 96 96" aria-hidden="true">
        <defs><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="68" y2="70">
          <stop offset="0" stop-color="#4d9fff" /><stop offset="1" stop-color="#3fd9ff" /></linearGradient></defs>
        <rect x="1.1" y="1.1" width="93.8" height="93.8" rx="21" fill="#060b14"
              stroke="rgba(77,159,255,0.22)" stroke-width="2.2" />
        <g stroke="url(#g1)" stroke-width="6.7" fill="none">
          <line x1="36.5" y1="29" x2="30" y2="66" /><line x1="36.5" y1="29" x2="59.5" y2="66" /><line x1="59.5" y1="66" x2="66" y2="29" /></g>
        <g fill="url(#g1)">
          <circle cx="36.5" cy="29" r="9.3" /><circle cx="30" cy="66" r="9.3" /><circle cx="59.5" cy="66" r="9.3" /><circle cx="66" cy="29" r="9.3" /></g>
      </svg>
    </div>
    <div class="cap"><b>В1 «Кант».</b> Заливка не трогается, силуэт возвращает тонкая граница цветом <code>--edge</code> — тем же, каким обведены панели приложения.</div>
  </figure>

  <figure>
    <div class="crop" data-crop="sign-v2-panel">
      <svg width="150" height="150" viewBox="0 0 96 96" aria-hidden="true">
        <defs><linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="68" y2="70">
          <stop offset="0" stop-color="#4d9fff" /><stop offset="1" stop-color="#3fd9ff" /></linearGradient></defs>
        <rect width="96" height="96" rx="22" fill="#091322" />
        <g stroke="url(#g2)" stroke-width="6.7" fill="none">
          <line x1="36.5" y1="29" x2="30" y2="66" /><line x1="36.5" y1="29" x2="59.5" y2="66" /><line x1="59.5" y1="66" x2="66" y2="29" /></g>
        <g fill="url(#g2)">
          <circle cx="36.5" cy="29" r="9.3" /><circle cx="30" cy="66" r="9.3" /><circle cx="59.5" cy="66" r="9.3" /><circle cx="66" cy="29" r="9.3" /></g>
      </svg>
    </div>
    <div class="cap"><b>В2 «Панель».</b> Подложка становится цветом панели приложения <code>--panel-solid #091322</code>. Нового цвета в бренд не вводится вовсе.</div>
  </figure>

  <figure>
    <div class="crop" data-crop="sign-v3-skos">
      <svg width="150" height="150" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="68" y2="70">
            <stop offset="0" stop-color="#4d9fff" /><stop offset="1" stop-color="#3fd9ff" /></linearGradient>
          <!-- Плашка освещена сверху-слева и уходит в фон снизу-справа: нижний стоп РАВЕН
               фону страницы, поэтому плитка не имеет нижней границы вовсе — она не лежит
               на фоне, а вырастает из него. -->
          <linearGradient id="p3" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
            <stop offset="0" stop-color="#16304f" /><stop offset="1" stop-color="#060b14" /></linearGradient>
        </defs>
        <rect width="96" height="96" rx="22" fill="url(#p3)" />
        <g stroke="url(#g3)" stroke-width="6.7" fill="none">
          <line x1="36.5" y1="29" x2="30" y2="66" /><line x1="36.5" y1="29" x2="59.5" y2="66" /><line x1="59.5" y1="66" x2="66" y2="29" /></g>
        <g fill="url(#g3)">
          <circle cx="36.5" cy="29" r="9.3" /><circle cx="30" cy="66" r="9.3" /><circle cx="59.5" cy="66" r="9.3" /><circle cx="66" cy="29" r="9.3" /></g>
      </svg>
    </div>
    <div class="cap"><b>В3 «Скос».</b> Плашка не плоская: она освещена сверху-слева и растворяется в фоне снизу-справа. Силуэт появляется, но плитка не выглядит наклейкой — у знака возникает глубина, а не рамка.</div>
  </figure>

  <figure>
    <div class="crop" data-crop="sign-v4-oreol">
      <!-- viewBox расширен на 10 единиц с каждой стороны, чтобы вместить свечение. Размер в
           пикселях увеличен РОВНО во столько же (116/96 × 150 = 181.25): иначе знак вышел бы
           на 17 % мельче соседних кадров, и владелец прочитал бы это как решение о размере. -->
      <svg width="181.25" height="181.25" viewBox="-10 -10 116 116" aria-hidden="true">
        <defs>
          <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="30" y1="26" x2="68" y2="70">
            <stop offset="0" stop-color="#4d9fff" /><stop offset="1" stop-color="#3fd9ff" /></linearGradient>
          <filter id="f4" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" /></filter>
        </defs>
        <rect width="96" height="96" rx="22" fill="rgba(63,217,255,0.30)" filter="url(#f4)" />
        <rect width="96" height="96" rx="22" fill="#060b14" />
        <g stroke="url(#g4)" stroke-width="6.7" fill="none">
          <line x1="36.5" y1="29" x2="30" y2="66" /><line x1="36.5" y1="29" x2="59.5" y2="66" /><line x1="59.5" y1="66" x2="66" y2="29" /></g>
        <g fill="url(#g4)">
          <circle cx="36.5" cy="29" r="9.3" /><circle cx="30" cy="66" r="9.3" /><circle cx="59.5" cy="66" r="9.3" /><circle cx="66" cy="29" r="9.3" /></g>
      </svg>
    </div>
    <div class="cap"><b>В4 «Ореол».</b> Заливка остаётся прежней, плитку рисует СВЕТ — мягкое свечение бирюзой <code>--accent</code> из-под краёв. Знак не получает рамки, но перестаёт сливаться.</div>
  </figure>

</div>
</body>
</html>
