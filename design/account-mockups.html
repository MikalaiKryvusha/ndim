<!doctype html>
<html lang="ru">

<title>NDim Space — управление аккаунтом, 4 макета</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     NDim Space — УПРАВЛЕНИЕ АККАУНТОМ. Фаза 3 эпика `plans/15` (план `plans/17`).

     ЗАКАЗ ВЛАДЕЛЬЦА (дословно, 2026-07-31):
       «нужно реализовать "Управление аккаунтом" на Профиле. Это было в оригинальном Ndim,
        а в 2,0 до сих пор нет. Нужна смена Email, сброс пароля, смена пароля, управление
        аватаром пользователя.»   + «"Удалить аккаунт" тоже надо»

     ═══ ЧТО РЕШАЮТ ЭТИ МАКЕТЫ — ОДИН вопрос ═══
     ГДЕ ЖИВЁТ управление аккаунтом и как оно связано с карточкой-шапкой «Профиля».
     Каждый вариант — цельный ответ, а не набор опций.

     ═══ ЧТО ИМИ НЕ РЕШАЕТСЯ (уже закрыто — не выбирайте это дважды) ═══
       · Состав действий над фото — ЧЕТЫРЕ, ваше слово (bugs/44).
       · Точка входа в управление фото — САМО ФОТО. Индустрия единогласна (GitHub, Slack,
         Notion, Google — researches/24 §3), поэтому во всех четырёх вариантах ОДИНАКОВО.
       · Подтверждение удаления — почта в поле + повторный вход (ваш ответ В2).
       · Раздел пароля виден только тем, у кого пароль есть (ваш ответ В1).
       · Слово «безвозвратно» остаётся (В4), опечатки 1.x исправлены (В5).

     ═══ ЧЕСТНОСТЬ МАКЕТА ═══
       · Токены обеих тем скопированы из src/routes/+layout.svelte дословно — цвета настоящие.
       · Карточка-шапка нарисована по ВЫКАЧЕННОМУ коду (.head-card / .head-who / .arow).
       · Тексты экрана управления — из 1.x дословно (researches/24 §2): «Управлять аккаунтом»,
         «Мой аккаунт», «Поменять пароль», «Поменять Email», «Удалить аккаунт», предупреждение
         об удалении. Формат даты «28 февраля 2025 г. в 20:48» — формула 1.x.
       · Почта и цифры ПРАВДОПОДОБНЫЕ, но не боевые: настоящие — это ПДн.
       · Строка «Способы входа» — НОВОЕ (её в 1.x не было). Взята у Vercel/Google, где раздел
         называется по способу входа, а не по учётным данным (researches/24 §3).
       · Кнопки «выйти на всех устройствах» НЕТ ни в одном варианте: без сервера её честно
         сделать нельзя (researches/24 §1.6). Макет не обещает невыполнимого.

     ВАРИАНТЫ:
       · V1 «Экран как в 1.x»    — отдельный маршрут, карточка «Мой аккаунт» + строки-двери,
                                   каждая дверь ведёт на свой подэкран. Максимальный паритет.
       · V2 «Одна страница»      — отдельный маршрут, но подэкранов нет: секции раскрываются
                                   на месте. Модель GitHub и Vercel.
       · V3 «Внутри Профиля»     — нового маршрута нет вовсе: карточка-шапка сама
                                   разворачивается в управление. Модель Slack.
       · V4 «Лист снизу»         — дверь поднимает лист поверх «Профиля»; на десктопе это
                                   диалог по центру. Контекст не теряется.
  ───────────────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── Токены светлой темы «Бумага» (дословно из src/routes/+layout.svelte) ── */
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --edge: #e6eef7; --edge-soft: #eef4fa;
    --primary: #1467d6; --primary-ink: #ffffff; --accent: #1467d6; --star: #e8a516;
    --heading: #12263c; --text: #33506e; --dim: #6a819a; --faint: #90a4bb;
    --card-shadow: 0 16px 40px rgba(29, 50, 71, 0.08);
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --danger: #d6544f; --danger-ink: #ffffff;
    --ghost: rgba(20, 103, 214, 0.28);
  }
  /* ── Токены тёмной темы (дословно оттуда же) ── */
  :root[data-theme='dark'] {
    --bg: #060b14; --panel: rgba(10, 21, 38, 0.78); --edge: rgba(77, 159, 255, 0.22);
    --edge-soft: rgba(77, 159, 255, 0.14);
    --primary: #1467d6; --primary-ink: #ffffff; --accent: #4d9fff; --star: #ffc93d;
    --heading: #eef6ff; --text: #dce9f7; --dim: #8299b1; --faint: #6d84a0;
    --card-shadow: 0 0 0 1px rgba(63, 217, 255, 0.06), 0 24px 60px rgba(2, 8, 20, 0.6);
    --danger: #f87171; --danger-ink: #12060a;
    --ghost: rgba(77, 159, 255, 0.34);
  }

  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f1826; }

  /* ── Панель выбора (дом стиля макетов проекта) ── */
  .picker {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: #14293d; color: #fff; font-size: 13px;
  }
  .picker b { margin-right: 6px; }
  .picker button {
    font: inherit; cursor: pointer; padding: 6px 13px; border-radius: 999px;
    border: 1px solid #2d4a66; background: transparent; color: #cfe0ef; transition: all .15s;
  }
  .picker button:hover { border-color: #3fd9ff; color: #fff; }
  .picker button.active { background: #1467d6; border-color: transparent; color: #fff; font-weight: 600; }
  .picker .sp { flex: 1; }
  .picker .hint { color: #8fa9c0; font-size: 11px; }

  /* ── Пояснение к текущему варианту ── */
  .note {
    padding: 12px 18px; background: #0d1c2c; color: #b8cee2; font-size: 12.5px; line-height: 1.6;
    border-bottom: 1px solid #1d3550;
  }
  .note h4 { color: #fff; font-size: 13.5px; margin-bottom: 5px; }
  .note .cost { color: #ffb4a8; }
  .note .win { color: #7ee0b8; }
  .note code { font-family: var(--mono); font-size: 11.5px; color: #9fd2ff; }

  /* ── Сцена ── */
  .stage { background: var(--bg); padding: 22px 0 44px; }
  .panes { display: flex; gap: 22px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  .pane { width: 390px; flex: none; }
  .pane > h5 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--faint); margin: 0 0 8px 4px; font-weight: 600;
  }
  .frame {
    background: var(--bg); border: 1px solid var(--edge); border-radius: 18px;
    padding: 14px 12px 18px; min-height: 300px; position: relative; overflow: hidden;
  }

  /* ── Десктоп 1440: настоящая оболочка продукта, а не колонка пошире ──────────
     Рельс слева от 1024px и контент в две колонны — утверждённый V2 «Рабочий стол»
     (MEMORY: desktop-layout-v2-workdesk). Экраны идут СТОПКОЙ, чтобы каждый был
     показан в честную ширину 1440, а не сжат в треть. */
  .stage[data-w='1440'] .panes { flex-direction: column; align-items: center; gap: 30px; }
  .stage[data-w='1440'] .pane { width: 1440px; }
  .stage[data-w='1440'] .frame { padding: 0; overflow: visible; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 380px; }
  .rail { border-right: 1px solid var(--edge); padding: 16px 12px; display: flex; flex-direction: column; gap: 3px; }
  .rail i {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px;
    font-style: normal; font-size: 13.5px; color: var(--dim);
  }
  .rail i.on { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-weight: 600; }
  .rail i span.dot { width: 17px; height: 17px; border-radius: 5px; background: currentColor; opacity: .5; flex: none; }
  .work { padding: 18px 22px 24px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .col { display: flex; flex-direction: column; }
  .stub { color: var(--faint); font-size: 12.5px; line-height: 1.6; }
  .desk-host { position: relative; }
  /* Диалог V4 на десктопе — по центру рабочей области, а не лист снизу */
  .stage[data-w='1440'] .scrim { border-radius: 0; }
  .stage[data-w='1440'] .sheet {
    left: 50%; right: auto; top: 40px; bottom: auto; transform: translateX(-50%);
    width: 520px; border-radius: 18px;
  }
  .stage[data-w='1440'] .grip { display: none; }

  /* ── Шапка приложения (схематична — она утверждена и не обсуждается) ── */
  .appbar {
    display: flex; align-items: center; gap: 9px; padding: 0 4px 12px;
    border-bottom: 1px solid var(--edge-soft); margin-bottom: 12px;
  }
  .appbar .mark {
    width: 26px; height: 26px; border-radius: 8px; background: #12263c; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  :root[data-theme='dark'] .appbar .mark { background: #eef6ff; color: #060b14; }
  .appbar .ttl { font-size: 13px; color: var(--heading); font-weight: 600; }
  .appbar .sp { flex: 1; }
  .appbar .back {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }

  /* ── Карточки продукта ── */
  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; box-shadow: var(--card-shadow);
  }
  .card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin-bottom: 10px; font-weight: 600;
  }

  /* ── Карточка-шапка (по выкаченному коду .head-card) ── */
  .head-card { display: flex; flex-direction: column; }
  .head-who { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
  .head-idn { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .head-card b { font-size: 17px; color: var(--heading); display: block; }
  .ameta { font-size: 12px; color: var(--faint); word-break: break-word; }

  /* Фото + его меню — ОДИНАКОВО во всех вариантах */
  .ava-wrap { position: relative; flex: none; }
  .ava {
    width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 600;
    cursor: pointer; border: 0;
  }
  .ava-edit {
    position: absolute; right: -3px; bottom: -3px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--edge); color: var(--accent);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--card-shadow);
  }
  /* Меню фото показано ОТДЕЛЬНЫМ блоком, а не всплывающим поверх карточки: наложением оно
     закрывало ряды аккаунта — а именно их и надо сравнивать между вариантами (поймано на
     кадрах Ш3, дважды). В продукте это, разумеется, всплывающее меню у самого фото. */
  .menu-demo { margin: -4px 0 12px; }
  .menu-cap { font-size: 11px; color: var(--faint); margin: 0 0 6px 4px; line-height: 1.45; }
  .photo-menu {
    width: 244px; background: var(--panel); border: 1px solid var(--edge); border-radius: 13px;
    box-shadow: var(--card-shadow); padding: 5px;
  }
  .photo-menu i {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 9px;
    font-size: 13px; font-style: normal; color: var(--text);
  }
  .photo-menu i.del { color: var(--danger); }
  .photo-menu i + i { border-top: 1px solid var(--edge-soft); }

  /* Место будущего «Статуса» (plans/09) — пунктиром, чтобы было видно, что оно занято */
  .slot {
    font-size: 11.5px; color: var(--faint); border: 1px dashed var(--ghost);
    border-radius: 7px; padding: 2px 7px; display: inline-block; margin-top: 2px;
  }

  /* ── Строки-двери (по выкаченному .arow) ── */
  .arow {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 2px; border: 0; border-top: 1px solid var(--edge-soft);
    background: transparent; font: inherit; font-size: 13.5px; color: var(--text);
    text-align: left;
  }
  .arow .ic { width: 24px; display: flex; justify-content: center; color: var(--accent); flex: none; }
  .arow .lb { flex: 1; }
  .arow .val { font-size: 12px; color: var(--faint); font-family: var(--mono); }
  .arow .chev { color: var(--faint); flex: none; }
  .arow.danger .lb { color: var(--danger); }
  .arow.danger .ic { color: var(--danger); }

  /* ── Свойство «ключ — значение» (карточка «Мой аккаунт») ── */
  .prop { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--edge-soft); }
  .prop:last-of-type { border-bottom: 0; }
  .prop .k { font-size: 12px; color: var(--dim); width: 108px; flex: none; }
  .prop .v { font-size: 14px; color: var(--heading); flex: 1; min-width: 0; word-break: break-word; }
  .prop .v small { display: block; font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-left: 6px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
  }

  /* ── Заголовок экрана (канон 1.x — по центру, со стрелкой назад) ── */
  .page-title { font-size: 17px; font-weight: 700; color: var(--heading); text-align: center; flex: 1; }

  /* ── Раскрывашка (V2 и V3) ── */
  .acc { border-top: 1px solid var(--edge-soft); }
  .acc-head {
    display: flex; align-items: center; gap: 11px; padding: 10px 2px;
    font-size: 13.5px; color: var(--text);
  }
  .acc-head .ic { width: 24px; display: flex; justify-content: center; color: var(--accent); flex: none; }
  .acc-head .lb { flex: 1; }
  .acc-head .caret { color: var(--faint); transition: transform .18s; }
  .acc.open .acc-head .caret { transform: rotate(90deg); }
  .acc-body { display: none; padding: 2px 2px 12px 37px; }
  .acc.open .acc-body { display: block; }

  /* ── Поля и кнопки ── */
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .inp {
    width: 100%; padding: 9px 11px; border: 1px solid var(--edge); border-radius: 10px;
    background: var(--bg); color: var(--heading); font: inherit; font-size: 13.5px;
  }
  .lede { font-size: 12.5px; color: var(--text); line-height: 1.55; margin-bottom: 11px; }
  .hint { font-size: 11.5px; color: var(--faint); line-height: 1.5; margin-top: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 15px; border-radius: 11px; border: 1px solid var(--edge);
    background: var(--panel); color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .btn.primary { background: var(--primary); border-color: transparent; color: var(--primary-ink); }
  .btn.warn { background: var(--danger); border-color: transparent; color: var(--danger-ink); font-weight: 600; }
  .cta { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
  .cta .btn { flex: 1 1 auto; }

  /* ── Блок удаления (отдельная секция внизу — GitHub/Vercel) ── */
  .zone {
    border: 1px solid color-mix(in srgb, var(--danger) 38%, transparent);
    border-radius: 16px; padding: 14px; margin-top: 16px;
  }
  .zone h3 { color: var(--danger); }
  .loss { margin: 10px 0 0; padding-left: 17px; font-size: 12.5px; color: var(--text); line-height: 1.75; }
  /* Виджет удаления идёт ВО ВСЮ ПАНЕЛЬ (отделение положением), но его СОДЕРЖИМОЕ — нет:
     иначе на 1440 «Удалить аккаунт» становится самой широкой мишенью экрана. NN/g требует
     обратного — опасное действие должно быть труднее в попадании, а не легче (закон Фиттса).
     Поймано на кадрах утверждённого V2. */
  .zone .lede, .zone .loss, .zone .field, .zone .cta, .zone .hint { max-width: 620px; }
  .zone .cta .btn { flex: 0 0 auto; }

  /* ── Лист снизу / диалог (V4) ── */
  .sheet-host { position: relative; }
  .scrim { position: absolute; inset: 0; background: rgba(6, 11, 20, .55); border-radius: 18px; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 18px 18px 0 0; padding: 8px 14px 16px; box-shadow: var(--card-shadow);
  }
  .grip { width: 38px; height: 4px; border-radius: 3px; background: var(--edge); margin: 2px auto 12px; }
  /* Раскладка листа на десктопе задаётся ОДИН раз — в блоке «Десктоп 1440» выше.
     Второе правило здесь конфликтовало с ним по left/right и уводило диалог за край
     (поймано на кадрах Ш3). */

  .flag { font-size: 11.5px; color: var(--faint); margin: 9px 4px 0; line-height: 1.5; }
  svg { display: block; }
</style>
</head>
<body>

<div class="picker">
  <b>Макет:</b>
  <button data-v="1" class="active">V1 «Экран как в 1.x»</button>
  <button data-v="2">V2 «Одна страница»</button>
  <button data-v="3">V3 «Внутри Профиля»</button>
  <button data-v="4">V4 «Лист снизу»</button>
  <span class="sp"></span>
  <button id="theme">☾ тёмная</button>
  <button id="width">Телефон 390</button>
  <span class="hint">Управление аккаунтом · фаза 3 эпика plans/15</span>
</div>

<div class="note" id="note"></div>

<div class="stage" id="stage" data-w="390">
  <div class="panes" id="panes"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════

const stage = document.getElementById('stage');
const panes = document.getElementById('panes');
const note = document.getElementById('note');
let current = '1';

function render() {
  const v = VARIANTS[current];
  note.innerHTML = v.note;
  const set = stage.dataset.w === '1440' ? v.desk : v.panes;
  panes.innerHTML = set.map(([label, inner, host]) => pane(label, inner, host)).join('');
}

document.querySelectorAll('.picker button[data-v]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.picker button[data-v]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.v;
    render();
  };
});

document.getElementById('theme').onclick = (e) => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? '☾ тёмная' : '☀ светлая';
};

document.getElementById('width').onclick = (e) => {
  const wide = stage.dataset.w === '1440';
  stage.dataset.w = wide ? '390' : '1440';
  e.target.textContent = wide ? 'Телефон 390' : 'Десктоп 1440';
  render();
};

render();
</script>
