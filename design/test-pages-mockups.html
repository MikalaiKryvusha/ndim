<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDim Space — Семейство страниц ТЕСТ, 4 макета</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     NDim Space — СЕМЕЙСТВО СТРАНИЦ-ОБЁРТОК ТЕСТА. Фаза 5 эпика 40 (план `plans/42`, шаг 2).

     ═══ ЧТО РЕШАЮТ ЭТИ МАКЕТЫ — ОДИН вопрос ═══
     КАК УСТРОЕНА страница-обёртка, на которую человек приходит по запросу «тест на
     совместимость» / «тест личности» / «love calculator» — и проходит путь от заголовка до
     результата, не увидев ни одной формы. Каркас у всех обёрток семейства ОДИН (движок один,
     анкета одна) — выбирается форма каркаса. Каждый вариант — цельный ответ, а не набор опций.

     ═══ ЧТО ИМИ НЕ РЕШАЕТСЯ (уже закрыто Вашими ответами — не выбирайте дважды) ═══
       · Состав первой волны: 4 страницы — хаб «Тесты» + совместимость + личность + калькулятор
         любви (интервью №028, В1 = А и В4 = Б). Во всех четырёх вариантах одинаково.
       · H1 страницы двоих — «Тест на совместимость», «тест для двоих» в подзаголовке
         (интервью №028, В2 = А).
       · Результат «Калькулятора любви» — СЧЁТ совпадений-фактов + искры, БЕЗ процентов
         (интервью №028, В3 = А).
       · Все жанры — обёртки поверх одного движка NDim Space; особых опросников нет
         (интервью №026, В2 = Г). Тест = оценка настоящих измерений каталога звёздами 0…10.
       · Числа похожести и порядок близости не публикуются нигде (№018 В4, №023).
       · До результата — ни одной формы (канон ideas/09); гость — полноценный человек (№009 В5).
       · Ответы оседают в ОДИН гостевой NDim ID — живой паспорт (шейпинг владельца ≈09:06).
       · Оболочка публичной страницы — как у страниц каталога: шапка со знаком, языком, темой
         и «Войти»; рельса навигации НЕТ сознательно (страницу открывает незнакомец из поиска).

     ═══ ЧЕСТНОСТЬ МАКЕТА ═══
       · Токены обеих тем скопированы из `src/routes/+layout.svelte` дословно — цвета настоящие.
       · Названия объектов в движке — НАСТОЯЩИЕ, из боевого среза каталога
         (`src/lib/content/dims-slice.json`): «Пацаны», «Особое мнение», Warcraft III,
         «Дом Дракона», Worms, Twenty One Pilots и другие. Ничего не сочинено.
       · ⚠️ УСЛОВНОЕ, и это надо знать при чтении: САМ НАБОР теста (какие 12 вещей войдут)
         соберётся позже по числу оценок боевого каталога; числа агрегатов («оценили ещё 9
         человек», «12 совпадений») — примеры формы, в бою придут из данных с порогом ≥3
         (№021 В1). Имя «Аня» в превью результата пары — вымышленный участник примера.
       · Тексты страниц — ЧЕРНОВИК ФОРМЫ. Финальные тексты пишутся по `AUTHOR_STYLOMETRY.md`
         и проходят Вашу вычитку до боя (оба языка).

     ВАРИАНТЫ:
       · V1 «Сразу к делу»  — инструмент ПЕРВЫМ экраном: заголовок, строка фактов и сразу
                              первая карточка со звёздами. Объяснение — ниже, для сомневающихся.
       · V2 «Лестница»      — сначала три шага «как это работает», кнопка «Начать» — и движок.
                              Модель большого аналога: понятность вперёд.
       · V3 «Диалог»        — страница разговаривает: одна крупная карточка-вопрос за раз,
                              «ведём за ручку». Максимум фокуса, минимум шума.
       · V4 «Зеркало»       — движок и РАСТУЩИЙ результат рядом: анкета собирается на глазах,
                              живой паспорт виден с первой оценки. (рекомендую)
  ───────────────────────────────────────────────────────────────────────── */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── Токены светлой темы «Бумага» (дословно из src/routes/+layout.svelte) ── */
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --edge: #e6eef7; --edge-soft: #eef4fa;
    --primary: #1467d6; --primary-ink: #ffffff; --accent: #1467d6; --star: #e8a516;
    --heading: #12263c; --text: #33506e; --dim: #6a819a; --faint: #90a4bb;
    --card-shadow: 0 16px 40px rgba(29, 50, 71, 0.08);
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --ok: #2e9e6b;
  }
  /* ── Токены тёмной темы (дословно оттуда же) ── */
  :root[data-theme='dark'] {
    --bg: #060b14; --panel: rgba(10, 21, 38, 0.78); --edge: rgba(77, 159, 255, 0.22);
    --edge-soft: rgba(77, 159, 255, 0.14);
    --primary: #1467d6; --primary-ink: #ffffff; --accent: #4d9fff; --star: #ffc93d;
    --heading: #eef6ff; --text: #dce9f7; --dim: #8299b1; --faint: #6d84a0;
    --card-shadow: 0 0 0 1px rgba(63, 217, 255, 0.06), 0 24px 60px rgba(2, 8, 20, 0.6);
    --ok: #56d3a0;
  }

  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f1826; }

  /* ── Панель выбора (дом стиля макетов проекта) ── */
  .picker {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: #14293d; color: #fff; font-size: 13px;
  }
  .picker b { margin-right: 6px; }
  .picker button {
    font: inherit; cursor: pointer; padding: 6px 13px; border-radius: 999px;
    border: 1px solid #2d4a66; background: transparent; color: #cfe0ef; transition: all .15s;
  }
  .picker button:hover { border-color: #3fd9ff; color: #fff; }
  .picker button.active { background: #1467d6; border-color: transparent; color: #fff; font-weight: 600; }
  .picker .sp { flex: 1; }
  .picker .hint { color: #8fa9c0; font-size: 11px; }

  .note {
    padding: 12px 16px; background: #0d1b2a; color: #b7cde0; font-size: 13px; line-height: 1.55;
    border-bottom: 1px solid #1d3247;
  }
  .note b { color: #fff; }
  .note .q { color: #7fd4ff; }

  .stage { padding: 22px 14px 60px; background: #0f1826; }
  .panes { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .pane { display: flex; flex-direction: column; gap: 7px; }
  .pane > .cap { color: #8fa9c0; font-size: 12px; text-align: center; max-width: 390px; }
  .stage[data-w='1440'] .pane > .cap { max-width: 1180px; }

  /* Оболочка экрана: страница показывается целиком, до низа — дверь в продукт часть решения */
  .screen {
    width: 390px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text);
    border-radius: 22px; border: 1px solid var(--edge); box-shadow: var(--card-shadow);
    display: flex; flex-direction: column;
  }
  .stage[data-w='1440'] .screen { width: 1180px; border-radius: 16px; }

  /* Адресная строка — слаг и языковой префикс видны, это часть решения */
  .url {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 7px 12px;
    background: var(--edge-soft); border-bottom: 1px solid var(--edge);
    font-family: var(--mono); font-size: 10.5px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .url .lock { color: var(--ok); }

  /* ── ШАПКА ПУБЛИЧНОЙ СТРАНИЦЫ — по живому коду dimension/[slug]/+page.svelte:
        знак + имя, переключатель языка ссылкой, тема, «Войти». Рельса НЕТ сознательно. ── */
  .bar {
    flex: 0 0 auto; min-height: 52px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  .bar .mark { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #1467d6, #3fd9ff); flex: 0 0 auto; }
  .bar .title { font-weight: 700; color: var(--heading); font-size: 14px; }
  .bar .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .bar .langsw { font-size: 12px; color: var(--dim); text-decoration: none; }
  .bar .icobtn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--edge);
    display: grid; place-items: center; color: var(--dim); font-size: 13px;
  }
  .bar .enter {
    font-size: 12px; padding: 6px 13px; border-radius: 999px;
    background: var(--primary); color: var(--primary-ink); font-weight: 600;
  }

  .body { flex: 1 1 auto; min-width: 0; }
  .wrap { max-width: 660px; margin: 0 auto; padding: 20px 16px 40px; }
  .stage[data-w='1440'] .wrap { padding: 30px 24px 60px; }
  .stage[data-w='1440'] .wrap.wide { max-width: 1040px; }

  h1 { font-size: 24px; line-height: 1.18; color: var(--heading); margin: 0 0 4px; }
  .stage[data-w='1440'] h1 { font-size: 32px; }
  .sub { font-size: 14.5px; color: var(--dim); line-height: 1.5; }
  .lede { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--faint); margin-top: 9px; }
  .lede span { display: inline-flex; align-items: center; gap: 5px; }
  .lede i { font-style: normal; color: var(--ok); }

  /* ── Движок оценки: карточка измерения + звёзды (жест продукта, 0…10) ── */
  .qcard {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 16px; box-shadow: var(--card-shadow); margin: 14px 0;
  }
  .qcard .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; }
  .qcard .name { font-size: 18px; font-weight: 700; color: var(--heading); margin: 3px 0 1px; }
  .qcard .meta { font-size: 12px; color: var(--faint); }
  .stars { display: flex; gap: 2px; font-size: 21px; margin: 10px 0 2px; }
  .stars i { font-style: normal; color: var(--edge); }
  .stars i.on { color: var(--star); }
  .stars.small { font-size: 14px; margin: 4px 0 0; }
  .scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); }
  .skip { font-size: 12.5px; color: var(--dim); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; cursor: pointer; margin-top: 9px; }

  .progress { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--dim); margin: 10px 0 2px; }
  .progress .track { flex: 1; height: 5px; border-radius: 999px; background: var(--edge-soft); overflow: hidden; }
  .progress .fill { height: 100%; width: 25%; border-radius: 999px; background: var(--primary); }

  /* Пройденные позиции — приглушённой лентой */
  .done-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: var(--edge-soft); font-size: 12.5px; color: var(--dim); }
  .done-row + .done-row { margin-top: 5px; }
  .done-row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .done-list { margin: 10px 0; }

  /* Очередь — что впереди */
  .queue { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
  .queue span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--edge); color: var(--faint); }

  h2 { font-size: 17px; color: var(--heading); margin: 22px 0 8px; }
  .stage[data-w='1440'] h2 { font-size: 20px; }
  p.t { line-height: 1.62; font-size: 14.5px; margin: 8px 0; }

  /* Три шага «как это работает» */
  .steps { display: grid; gap: 9px; margin: 14px 0; }
  .stage[data-w='1440'] .steps.grid3 { grid-template-columns: 1fr 1fr 1fr; }
  .step { display: flex; gap: 11px; background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 14px; }
  .step .n { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .step .tt { font-size: 13.5px; line-height: 1.45; }
  .step .tt b { color: var(--heading); display: block; margin-bottom: 1px; }

  .cta {
    display: inline-block; padding: 11px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--primary); color: var(--primary-ink); font: inherit; font-size: 14.5px; font-weight: 600;
  }
  .cta.ghost { background: transparent; border: 1px solid var(--edge); color: var(--text); font-weight: 500; }

  /* Диалоговые реплики (V3) */
  .say { max-width: 88%; background: var(--panel); border: 1px solid var(--edge); border-radius: 14px 14px 14px 4px; padding: 10px 13px; font-size: 14px; line-height: 1.5; margin: 10px 0; }
  .say.me { margin-left: auto; border-radius: 14px 14px 4px 14px; background: var(--edge-soft); color: var(--dim); font-size: 13px; }
  .dots { display: flex; gap: 4px; margin: 10px 0 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 999px; background: var(--edge); }
  .dots i.on { background: var(--primary); }

  /* Растущий паспорт (V4 и промежуточный результат) */
  .mirror {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--card-shadow);
  }
  .mirror h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin: 0 0 8px; }
  .fact { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; padding: 6px 0; }
  .fact + .fact { border-top: 1px dashed var(--edge); }
  .fact .ic { flex: 0 0 auto; width: 20px; text-align: center; }
  .fact b { color: var(--heading); }
  .crowd { font-size: 12.5px; color: var(--dim); margin-top: 9px; }
  .grow { font-size: 12px; color: var(--ok); margin-top: 7px; }

  /* Двухслойность V4 на десктопе */
  .two { display: grid; gap: 18px; }
  .stage[data-w='1440'] .two { grid-template-columns: 1.25fr 1fr; align-items: start; }

  /* Приглашение второго */
  .invite {
    border: 1.5px dashed var(--accent); border-radius: 16px; padding: 14px 16px; margin: 18px 0;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
  }
  .invite h3 { font-size: 15px; color: var(--heading); margin: 0 0 5px; }
  .invite p { font-size: 13.5px; line-height: 1.5; margin: 0 0 10px; }
  .linkrow { display: flex; gap: 7px; }
  .linkrow .fld {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 11px; border: 1px solid var(--edge);
    background: var(--edge-soft); font-family: var(--mono); font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .linkrow .cta { padding: 9px 15px; font-size: 13px; flex: 0 0 auto; }
  .invite .fine { font-size: 11.5px; color: var(--faint); margin: 8px 0 0; }

  /* Результат пары */
  .pair {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 15px 16px; margin: 14px 0; box-shadow: var(--card-shadow);
  }
  .pair .who { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .pair .ava { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
  .pair .ava.a { background: #1467d6; }
  .pair .ava.b { background: #7c5cd6; }
  .pair .who b { color: var(--heading); font-size: 14px; }
  .pair .who span { color: var(--faint); font-size: 12px; }
  .bigcount { display: flex; align-items: baseline; gap: 9px; margin: 6px 0 2px; }
  .bigcount .n { font-size: 34px; font-weight: 800; color: var(--heading); line-height: 1; }
  .bigcount .lbl { font-size: 13.5px; color: var(--dim); }
  .subcount { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }

  /* Мост-паспорт */
  .keep {
    border-radius: 16px; padding: 14px 16px; margin: 18px 0;
    background: var(--edge-soft); border: 1px solid var(--edge);
  }
  .keep h3 { font-size: 14.5px; color: var(--heading); margin: 0 0 5px; }
  .keep p { font-size: 13px; line-height: 1.55; margin: 0 0 10px; }
  .keep .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* FAQ */
  .faq { margin: 18px 0 6px; }
  .faq details { border-top: 1px solid var(--edge); padding: 9px 2px; }
  .faq details:last-child { border-bottom: 1px solid var(--edge); }
  .faq summary { font-size: 13.5px; font-weight: 600; color: var(--heading); cursor: pointer; }
  .faq p { font-size: 13px; line-height: 1.55; color: var(--text); margin: 7px 0 2px; }

  .foot { font-size: 12px; color: var(--faint); line-height: 1.55; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--edge); }
  .xlink { font-size: 13px; margin-top: 10px; }
  .xlink a { color: var(--accent); text-decoration: none; }

  /* Хаб */
  .hub-cards { display: grid; gap: 11px; margin: 16px 0; }
  .stage[data-w='1440'] .hub-cards { grid-template-columns: 1fr 1fr 1fr; }
  .hcard {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px;
    padding: 15px 16px; box-shadow: var(--card-shadow);
  }
  .hcard .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
  .hcard .nm { font-size: 16.5px; font-weight: 700; color: var(--heading); }
  .hcard p { font-size: 13px; line-height: 1.5; color: var(--text); flex: 1; }
  .hcard .go { font-size: 13px; color: var(--accent); font-weight: 600; }
  .hub-one { font-size: 13px; line-height: 1.6; background: var(--edge-soft); border-radius: 12px; padding: 10px 13px; margin: 4px 0 14px; }

  /* Искры love */
  .spark { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; padding: 6px 0; }
  .spark + .spark { border-top: 1px dashed var(--edge); }
  .heart { color: #e05673; }
</style>
</head>
<body>

<div class="picker">
  <b>Семейство ТЕСТ:</b>
  <button data-v="1" class="active">V1 Сразу к делу</button>
  <button data-v="2">V2 Лестница</button>
  <button data-v="3">V3 Диалог</button>
  <button data-v="4">V4 Зеркало</button>
  <span class="sp"></span>
  <button id="theme">☀ светлая</button>
  <button id="width">Телефон 390</button>
  <span class="hint">каркас один на все обёртки — выбирается его форма</span>
</div>

<div class="note" id="note"></div>
<div class="stage" id="stage" data-w="390"><div class="panes" id="panes"></div></div>

<script>
/* Материал движка — настоящие объекты боевого каталога (dims-slice.json). */
const SET = [
  { kind: 'Телесериал', name: '«Пацаны»', meta: '2019', v: 8 },
  { kind: 'Фильм', name: '«Особое мнение»', meta: '2002 · Стивен Спилберг', v: 7 },
  { kind: 'Видеоигра', name: 'Warcraft III: Reign of Chaos', meta: '2002', v: 10 },
  { kind: 'Телесериал', name: '«Дом Дракона»', meta: '2022', v: null }, // текущая карточка
  { kind: 'Фильм', name: '«Супермен»', meta: '1978', v: null },
  { kind: 'Музыкальный исполнитель', name: 'Twenty One Pilots', meta: '', v: null },
  { kind: 'Практика', name: 'Катание на лыжах', meta: '', v: null },
  { kind: 'Видеоигра', name: 'Worms', meta: '1995', v: null },
  { kind: 'Практика', name: 'Выращивание комнатных растений', meta: '', v: null },
  { kind: 'Роман', name: '«Приключения Оливера Твиста»', meta: '1838 · Чарльз Диккенс', v: null },
  { kind: 'Фильм', name: '«Человек в железной маске»', meta: '1998', v: null },
  { kind: 'Фильм', name: '«Вышка»', meta: '2022', v: null },
];

const note = document.getElementById('note');
let current = '1';

function render() {
  const v = VARIANTS[current];
  note.innerHTML = v.note;
  // На десктопе — два пейна (совместимость + хаб): широкие страницы длинные, три не читаются.
  const idx = stage.dataset.w === '1440' ? [0, 2] : [0, 1, 2];
  panes.innerHTML = idx
    .map((i) => `<div class="pane"><div>${v.build[i]}</div><div class="cap">${CAPS[i]}</div></div>`)
    .join('');
}

document.querySelectorAll('.picker button[data-v]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.picker button[data-v]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.v;
    render();
  };
});

document.getElementById('theme').onclick = (e) => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? '☾ тёмная' : '☀ светлая';
};

document.getElementById('width').onclick = (e) => {
  const wide = stage.dataset.w === '1440';
  stage.dataset.w = wide ? '390' : '1440';
  e.target.textContent = wide ? 'Телефон 390' : 'Десктоп 1440';
  render();
};
