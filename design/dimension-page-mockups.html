/* Правило показа оценок — ОДНО на все четыре варианта, ровно как в коде
   (`src/routes/dimension/[slug]/+page.ts`): звёзды при rates ≥ 1, серый текст
   при нуле, число проголосовавших при rates ≥ 3. */
const rateBlock = (d) => {
  if (!d.rates) return '<p class="rate"><span class="novotes">Ещё без голосов</span></p>';
  const full = Math.round(d.rating);
  const stars = Array.from({ length: 10 }, (_, i) => `<i class="${i < full ? 'on' : ''}">★</i>`).join('');
  const votes = d.rates >= 3 ? `<span class="votes">оценили: ${d.rates}</span>` : '';
  return `<p class="rate"><span class="stars">${stars}</span>
    <span class="val">${d.rating.toFixed(1).replace('.', ',')}</span>${votes}</p>`;
};

/* Год «-» и автор «-» в каталоге означают «неизвестно» — элемент просто не показывается
   (Ваше решение `ideas/26`). У «Катания на лыжах» нет ни того, ни другого. */
const has = (v) => v && v !== '-';

const facts = (d) => `
  <p class="facts">
    <span class="kind">${d.typeRu}</span>
    ${has(d.year) ? `<i>·</i><span>${d.year}</span>` : ''}
    ${has(d.authorRu) ? `<i>·</i><span>${d.authorRu}</span>` : ''}
  </p>`;

const title = (d) => `
  <h1>${d.ru}</h1>
  ${d.en && d.en !== d.ru ? `<p class="orig">${d.en}</p>` : ''}`;

const desc = (d) => `<div class="desc"><p>${d.descRu}</p></div>`;

const tags = (d) => `<div class="tags">${d.tags.map((t) => `<span>${t}</span>`).join('')}</div>`;

const url = (d) => `
  <div class="url"><span class="lock">🔒</span>ndimspace.app/ru/dimension/${d.slug}</div>`;

/* Шапка — ВО ВСЮ ШИРИНУ поверх рельса (V3-А, `ideas/17`), как в `AppBar.svelte`. */
const bar = () => `
  <div class="bar">
    <div class="mark"></div><div class="title">NDim Space</div>
    <div class="tools">
      <span class="icobtn">☾</span><span class="icobtn">RU</span>
      <span class="enter">Войти</span>
    </div>
  </div>`;

/* Рельс навигации — пять пунктов `SideRail.svelte`, от 1024px.
   ⚠️ Человек из поиска в аккаунт не вошёл, и любой пункт рельса ведёт его в дверь входа.
   Рельс здесь стоит потому, что это НАСТОЯЩАЯ десктопная оболочка продукта; прятать её
   на публичной странице — отдельное решение, и оно за владельцем, а не за мной. */
const rail = () => `
  <nav class="rail">
    <a><span class="ico"></span>Профиль</a>
    <a><span class="ico"></span>Связи</a>
    <a><span class="ico"></span>Пространство</a>
    <a class="on"><span class="ico"></span>Измерения</a>
    <a><span class="ico"></span>Меню</a>
  </nav>`;

/* Дверь в продукт. Термины голыми не бросаются — Ваша правка 2026-08-02:
   не «5111 измерений», а «объектов человеческой культуры». */
const door = (d) => `
  <div class="door">
    <h3>Это одна из координат, по которым люди описывают себя</h3>
    <p>В Пространстве NDim человек — это точка, а такие объекты — оси вокруг неё. Оцените
       «${d.ru}» и ещё несколько вещей, которые Вы любите, — и увидите людей, у которых
       они отзываются так же.</p>
    <span class="go">Оценить и посмотреть, кто рядом</span>
  </div>
  <p class="foot">NDim Space — честный поиск похожих людей по математической близости.
     Бесплатно, без рекламы и без подписок. Сейчас в Пространстве 5111 объектов
     человеческой культуры.</p>`;

const shell = (inner, d, wide = false) => `
  <div class="screen">
    ${url(d)}
    ${bar()}
    <div class="shell">
      ${rail()}
      <div class="body"><div class="wrap${wide ? ' wide' : ''}">${inner}</div></div>
    </div>
  </div>`;

/* ── V1 «Статья» ─────────────────────────────────────────────────────────── */
const v1 = (d) => shell(`
  ${facts(d)}
  ${title(d)}
  ${rateBlock(d)}
  ${desc(d)}
  ${tags(d)}
  ${door(d)}`, d);

/* ── V2 «Досье» ──────────────────────────────────────────────────────────── */
const v2 = (d) => shell(`
  ${title(d)}
  <div class="dossier">
    ${rateBlock(d)}
    <dl>
      <dt>Вид</dt><dd>${d.typeRu}</dd>
      ${has(d.year) ? `<dt>Год</dt><dd>${d.year}</dd>` : ''}
      ${has(d.authorRu) ? `<dt>Автор</dt><dd>${d.authorRu}</dd>` : ''}
      <dt>В оригинале</dt><dd>${d.en}</dd>
      <dt>Теги</dt><dd>${d.tags.join(', ')}</dd>
    </dl>
  </div>
  ${desc(d)}
  ${door(d)}`, d);

/* ── V3 «Вопрос Вам» ─────────────────────────────────────────────────────── */
const askBlock = (d) => `
  <div class="ask">
    <h2>Насколько это про Вас?</h2>
    <div class="sub">${d.ru}</div>
    <div class="pick">${Array.from({ length: 10 }, (_, i) => `<i class="${i < 7 ? 'on' : ''}">★</i>`).join('')}</div>
    <div class="scale"><span>0 — совсем нет</span><span>10 — это про меня</span></div>
    <p class="note2">Аккаунт не нужен: оцените прямо здесь. Наберётся несколько таких оценок —
       и Пространство покажет людей, у которых они совпадают с Вашими.</p>
    ${d.rates ? `<p class="crowd">${d.rates >= 3
        ? `Средняя оценка ${d.rating.toFixed(1).replace('.', ',')} · оценили: ${d.rates}`
        : `Средняя оценка ${d.rating.toFixed(1).replace('.', ',')}`}</p>`
      : '<p class="crowd">Вы будете первым, кто это оценит.</p>'}
  </div>`;

const v3 = (d) => shell(`
  ${facts(d)}
  ${title(d)}
  ${askBlock(d)}
  ${desc(d)}
  ${tags(d)}
  <p class="foot">NDim Space — честный поиск похожих людей по математической близости.
     Бесплатно, без рекламы и без подписок.</p>`, d);

/* ── V4 «Соседство» ──────────────────────────────────────────────────────── */
const NEIGHBOURS = {
  '2VVDn7dCUFRXGlZnoLke': [
    ['Видеоигра', 'Disco Elysium', '9,1 · оценили: 27'],
    ['Видеоигра', 'Borderlands 2', '7,5'],
    ['Видеоигра', 'Outer Wilds', 'ещё без голосов'],
    ['Фильм', '«Властелин колец»', '9,0 · оценили: 12'],
  ],
  '00S8ckKACl6WhEdc9n3V': [
    ['Фильм', '«Таксист»', '8,4 · оценили: 41'],
    ['Фильм', '«Основной инстинкт»', 'ещё без голосов'],
    ['Телесериал', '«Настоящий детектив»', '8,8 · оценили: 19'],
    ['Фильм', '«Исчезнувшая»', 'ещё без голосов'],
  ],
  '0Q43WuaqKwxbGFxEKHph': [
    ['Телесериал', '«Игра престолов»', '9,2 · оценили: 33'],
    ['Роман', '«Пламя и кровь»', 'ещё без голосов'],
    ['Телесериал', '«Ведьмак»', '6,9'],
    ['Фильм', '«Дюна»', '8,1 · оценили: 7'],
  ],
  '11mnoskttOStaViFeOak': [
    ['Практика', 'Сноуборд', 'ещё без голосов'],
    ['Практика', 'Горные походы', '8,0'],
    ['Практика', 'Ранние подъёмы', '6,2 · оценили: 58'],
    ['Практика', 'Холодный душ', 'ещё без голосов'],
  ],
};

const nearBlock = (d) => `
  <div class="near">
    <h3>Рядом в Пространстве</h3>
    <p class="why">Объекты того же рода — с них удобно начать, если «${d.ru}» Вам близко.</p>
    <div class="nlist">
      ${(NEIGHBOURS[d.id] ?? []).map(([k, n, r]) => `
        <div class="nrow"><span class="nk">${k}</span><span class="nn">${n}</span><span class="nr">${r}</span></div>`).join('')}
    </div>
  </div>`;

const v4 = (d) => shell(`
  <div class="two">
    <div>
      ${facts(d)}
      ${title(d)}
      ${rateBlock(d)}
      ${desc(d)}
      ${tags(d)}
    </div>
    <div>
      ${door(d)}
      ${nearBlock(d)}
    </div>
  </div>`, d, true);

/* ── Сборка ──────────────────────────────────────────────────────────────── */
const CAPS = [
  '4 голоса → звёзды И счётчик',
  '0 голосов → «ещё без голосов», звёзд нет',
  '1 голос → звёзды БЕЗ счётчика',
  '3 голоса, но НЕТ ни года, ни автора',
];

const VARIANTS = {
  1: {
    note: `<b>V1 «Статья».</b> Уважение к тексту: строка данных, заголовок, оценка тонкой строкой,
      описание во всю ширину. Модель энциклопедии — так устроены страницы, которые поиск любит
      больше всего. Самый простой и самый быстрый вариант.
      <span class="q">Цена: выше сгиба страница почти ничего не говорит о том, куда человек попал.
      Он прочитает про «Дом Дракона» и уйдёт, так и не поняв, что такое NDim.</span>`,
    build: v1,
  },
  2: {
    note: `<b>V2 «Досье».</b> Сверху карточка объекта — вид, год, автор, оригинальное название,
      теги и оценка одним блоком; текст под ней. Модель Кинопоиска и IMDb: данные считываются
      мгновенно, взгляду есть за что зацепиться.
      <span class="q">Цена: карточка отодвигает описание вниз — а описание и есть то единственное,
      ради чего эти 5111 страниц вообще существуют для поиска.</span>`,
    build: v2,
  },
  3: {
    note: `<b>V3 «Вопрос Вам».</b> Центр страницы — не объект, а ЖЕСТ: «Насколько это про Вас?»,
      звёзды прямо здесь, аккаунт не нужен. Публичная страница становится САМИМ ИНСТРУМЕНТОМ, а не
      витриной. <b>Основание не вкусовое:</b> 68 % поисков в 2026 году не дают клика, и выигрывают
      поверхности, которые ИИ-ответ не замещает (<i>researches/30</i>). У нас такая ровно одна —
      инструмент, — и сегодня она заперта за входом.
      <span class="q">Цена, и она настоящая: оценка без аккаунта тянет за собой гостевой режим
      (эпик plans/22, гость живёт 7 дней). То есть эта страница зависит от чужой фазы, а три
      другие — нет.</span>`,
    build: v3,
  },
  4: {
    note: `<b>V4 «Соседство».</b> Объект показан ВНУТРИ Пространства: рядом другие объекты того же
      рода. Это объясняет идею продукта не словами, а формой, и попутно связывает 5111 страниц
      между собой — на таком объёме внутренние ссылки это то, чем страницы вообще находятся
      роботом.
      <span class="q">Цена: соседство надо чем-то считать. По людям его посчитать нельзя — оценок
      мало (4089 на 5111 объектов), значит по виду и тегам, а это слабее и иногда будет выглядеть
      случайным.</span>`,
    build: v4,
  },
};

const stage = document.getElementById('stage');
const panes = document.getElementById('panes');
const note = document.getElementById('note');
let current = '1';

function render() {
  const v = VARIANTS[current];
  note.innerHTML = v.note;
  // На десктопе показываем два случая: широкая страница длинная, четыре рядом не читаются.
  const items = stage.dataset.w === '1440' ? [DIMS[0], DIMS[1]] : DIMS;
  panes.innerHTML = items
    .map((d, i) => `<div class="pane"><div>${v.build(d)}</div><div class="cap">${CAPS[DIMS.indexOf(d)]}</div></div>`)
    .join('');
}

document.querySelectorAll('.picker button[data-v]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.picker button[data-v]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.v;
    render();
  };
});

document.getElementById('theme').onclick = (e) => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? '☾ тёмная' : '☀ светлая';
};

document.getElementById('width').onclick = (e) => {
  const wide = stage.dataset.w === '1440';
  stage.dataset.w = wide ? '390' : '1440';
  e.target.textContent = wide ? 'Телефон 390' : 'Десктоп 1440';
  render();
};

render();
</script>
</body>
</html>
